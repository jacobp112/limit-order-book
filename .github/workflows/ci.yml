name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: fuzz harness (stable, seed corpus)
        run: cargo test --release --manifest-path fuzz/Cargo.toml

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p lob-wasm --profile wasm --target wasm32-unknown-unknown
      - name: freshly built module matches `lob replay`
        run: node explainer/check.mjs target/wasm32-unknown-unknown/wasm/lob_wasm.wasm
      - name: committed explainer/lob.wasm matches `lob replay`
        run: node explainer/check.mjs
